{% extends "dashboard/base.html" %}

{% block title %}Add Expense - Financial Tracker{% endblock %}

{% block body_attrs %} class="dashboard-page"{% endblock %}

{% block content %}
<div class="card content-section">
    <h1>Add Expense</h1>

    {% if error_message %}
    <p class="form-error">{{ error_message }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for="name">Expense Name:</label>
            <input type="text" id="name" name="name" required placeholder="e.g. Mortgage" class="form-control">
        </div>

        <div class="form-group">
            <label for="amount">Amount:</label>
            <input type="number" id="amount" name="amount" step="0.01" required placeholder="0.00" class="form-control">
        </div>

        <div class="form-group">
            <label for="frequency">Frequency:</label>
            <select id="frequency" name="frequency" required class="form-control">
                <option value="once off">Once Off</option>
                <option value="weekly">Weekly</option>
                <option value="monthly" selected>Monthly</option>
                <option value="annually">Annually</option>
            </select>
        </div>

        <div class="form-group">
            <label for="expense_type">Expense Type:</label>
            <select id="expense_type" name="expense_type" required class="form-control">
                <option value="fixed" selected>Fixed</option>
                <option value="fun">Fun</option>
                <option value="future">Future</option>
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-new">Add Expense</button>
            <a href="{% url 'dashboard-home' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
