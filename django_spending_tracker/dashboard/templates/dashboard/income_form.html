{% extends "dashboard/base.html" %}

{% block title %}Update Income{% endblock %}

{% block content %}
<!-- Income edit form: lets the user update one existing income record. -->
<div class="card content-section">
    <h1>Update Income</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a class="btn btn-outline-secondary" href="{% url 'income-detail' object.pk %}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
