{% extends "dashboard/base.html" %}

{% block title %}Delete {{ expense_type_label }} Expense{% endblock %}

{% block content %}
<!-- Delete confirmation: asks the user to confirm expense removal. -->
<div class="card content-section">
    <h1>Delete {{ expense_type_label }} Expense</h1>
    <p>Are you sure you want to delete <strong>{{ object.name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a class="btn btn-outline-secondary" href="{% url 'spending-tracker' %}">Cancel</a>
    </form>
</div>
{% endblock %}
